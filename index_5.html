<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>숫자 말하기 — 50~100 (모드/타이머/점수/콤보)</title>
<style>
  :root{
    --bg:#0b0e14; --card:#121725; --line:#232a37;
    --ink:#e9eef7; --muted:#9aa4b2; --ok:#35d07f; --bad:#ff6b6b; --brand:#6ea8fe; --gold:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;overflow:hidden}
  #confetti{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  header h1{font-size:18px;margin:0;font-weight:700}
  .card{background:rgba(18,23,37,.86);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:14px;background:rgba(255,255,255,.02)}
  .big{font-size:96px;line-height:1;font-weight:900;text-align:center;margin:16px 0 4px;text-shadow:0 6px 24px rgba(0,0,0,.45)}
  .sub{font-size:16px;text-align:center;color:var(--muted);min-height:22px}
  .spoken{margin:8px 0 0;font-size:15px;text-align:center;color:#b7c2d6;min-height:28px}
  .spoken b{color:#fff}
  .center{display:flex;justify-content:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
  button{border:1px solid var(--line);background:#18213a;color:#eaf2ff;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .primary{background:#244a86;border-color:#2a4e8a}
  .ghost{background:transparent}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  .status{display:flex;align-items:center;gap:8px;justify-content:center;color:#9aa4b2;font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:#666}
  .dot.live{background:#2ecc71;box-shadow:0 0 0 6px #2ecc7140}
  .bar{height:10px;background:rgba(10,14,24,.7);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#6ea8fe,#32d96b)}
  .range{display:flex;gap:8px;align-items:center}
  input[type=number],select,input[type=range]{background:#101522;color:#dfe6ef;border:1px solid var(--line);border-radius:10px;padding:8px}
  input[type=number]{width:84px}
  select{height:36px}
  .board{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .stat{background:#101522;border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:#cfe2ff}
  .stat .v{color:#fff;font-weight:700}
  .timerWrap{margin:10px 0}
  .timerBar{height:14px;border:1px solid var(--line);border-radius:999px;background:#0c1222;overflow:hidden}
  .timerFill{height:100%;width:100%;background:linear-gradient(90deg,#35d07f,#6ea8fe)}
  .combo{color:var(--gold);font-weight:800}
  .help{font-size:12px;color:#9aa4b2;text-align:center;margin-top:6px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="wrap">
  <header>
    <h1>🎤 숫자 말하기 — 50~100</h1>
    <div class="row">
      <span class="chip">정답 → 띵동 + 종이조각 · 오답 → 땡</span>
    </div>
  </header>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:end">
      <div class="row">
        <div class="range">
          <label>시작</label><input id="start" type="number" value="50"/>
          <label>끝</label><input id="end" type="number" value="100"/>
          <button id="apply" class="ghost" title="범위 적용">적용</button>
        </div>
        <div class="range">
          <label>모드</label>
          <select id="mode">
            <option value="asc">오름차순</option>
            <option value="desc">내림차순 (100→50)</option>
            <option value="rand">랜덤 출제</option>
          </select>
        </div>
        <div class="range">
          <label>제한시간(초)</label>
          <input id="limit" type="number" value="5" min="2" max="20" step="1" style="width:68px"/>
        </div>
      </div>

      <div class="range"><label class="chip">진행: <span id="progressText">0 / 51</span></label></div>
    </div>

    <div class="bar" style="margin:10px 0 8px"><div id="fill" class="fill"></div></div>

    <div class="board">
      <div class="stat">점수: <span id="score" class="v">0</span></div>
      <div class="stat">콤보: <span id="combo" class="v">0</span></div>
      <div class="stat">최대콤보: <span id="bestCombo" class="v">0</span></div>
    </div>

    <div class="timerWrap">
      <div class="timerBar"><div id="timerFill" class="timerFill"></div></div>
    </div>

    <div id="current" class="big" aria-live="polite">50</div>
    <div id="feedback" class="sub">&nbsp;</div>
    <div id="spoken" class="spoken">💬 내가 말한 말: <b>-</b></div>

    <div class="center">
      <button id="btnMic" class="primary">🎙️ 시작(마이크)</button>
      <button id="btnStop" class="ghost" disabled>⏹ 멈추기</button>
      <button id="btnNext" class="ghost">➡️ 다음</button>
      <button id="btnRepeat" class="ghost">🔁 다시 말하기(TTS)</button>
      <button id="btnReset" class="ghost">↺ 점수/콤보 초기화</button>
    </div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">대기 중</span>
    </div>
    <p class="help">iOS는 음성인식 미지원. <b>Live Server</b> 등으로 <code>http://localhost</code>에서 실행해 주세요. (스페이스바로도 진행 가능)</p>
  </div>
</div>

<script>
/* =======================
   WebAudio: 효과음 (띵동/땡)
   ======================= */
let audioCtx;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function envGain(ctx, attack=0.005, hold=0.05, release=0.15, peak=0.9){
  const g = ctx.createGain();
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t+attack);
  g.gain.setValueAtTime(peak, t+attack+hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t+attack+hold+release);
  return g;
}
function playTone(freq=880, dur=0.15, type='sine', vol=0.9, delay=0){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const g = envGain(ctx, 0.005, Math.max(0, dur-0.04), 0.12, vol);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
  osc.connect(g).connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + dur + 0.2);
}
function playDingDong(){
  playTone(1319, 0.12, 'sine', 0.9, 0);     // 딩
  playTone(880,  0.16, 'sine', 0.9, 0.16);  // 동
}
function playBuzz(){
  playTone(220, 0.25, 'sawtooth', 0.7, 0);  // 땡
}

/* =======================
   Confetti (가벼운 종이조각)
   ======================= */
const confettiCanvas = document.getElementById('confetti');
const ctx2 = confettiCanvas.getContext('2d');
let CW=innerWidth, CH=innerHeight;
function resize(){ CW=innerWidth; CH=innerHeight; confettiCanvas.width=CW; confettiCanvas.height=CH; }
resize(); addEventListener('resize', resize);

const COLORS = ['#6ea8fe','#32d96b','#ffd166','#ff6b6b','#a78bfa','#ffffff','#b2f5ea'];
let confettiPieces = [];
let confettiRunning = false;

function spawnConfettiRow(intensity=0.6){
  const count = Math.floor(80 * intensity);
  for(let i=0;i<count;i++){
    const x = Math.random()*CW;
    const size = 6 + Math.random()*10;
    confettiPieces.push({
      x, y: -10 - Math.random()*60,
      w: size * (0.8 + Math.random()*0.6),
      h: size * (0.6 + Math.random()*0.6),
      vy: 1.2 + Math.random()*1.6,
      vx: (Math.random()*1.2 - 0.6),
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()*0.08 - 0.04),
      color: COLORS[(Math.random()*COLORS.length)|0],
      life: 0, maxLife: 240 + Math.random()*120,
      flip: Math.random()<0.5 ? 1 : -1
    });
  }
}
function stepConfetti(){
  ctx2.clearRect(0,0,CW,CH);
  for(let i=confettiPieces.length-1;i>=0;i--){
    const p=confettiPieces[i];
    p.life++; p.x += p.vx + Math.sin((p.life+p.w)*0.03)*0.25; p.y += p.vy; p.rot += p.vr;
    ctx2.save(); ctx2.translate(p.x, p.y); ctx2.rotate(p.rot);
    const front = p.color, back = 'rgba(255,255,255,0.6)';
    ctx2.fillStyle = (p.flip*(Math.sin(p.life*0.15))>0) ? front : back;
    ctx2.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx2.restore();
    if(p.y > CH + 20 || p.life > p.maxLife) confettiPieces.splice(i,1);
  }
  if(confettiRunning || confettiPieces.length>0) requestAnimationFrame(stepConfetti);
}
function startConfetti(duration=1000, intensity=0.7){
  confettiRunning = true;
  const t0 = performance.now();
  function tick(now){
    if(now - t0 < duration){
      spawnConfettiRow(intensity);
      setTimeout(()=>spawnConfettiRow(intensity*0.75), 120);
      setTimeout(()=>spawnConfettiRow(intensity*0.5), 220);
      requestAnimationFrame(tick);
    }else confettiRunning = false;
  }
  if(confettiPieces.length===0) requestAnimationFrame(stepConfetti);
  requestAnimationFrame(tick);
}

/* =======================
   게임 로직 (음성 인식 + 모드/타이머/점수)
   ======================= */
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const elStart=document.getElementById('start'), elEnd=document.getElementById('end'), elApply=document.getElementById('apply');
  const elMode=document.getElementById('mode'), elLimit=document.getElementById('limit');
  const elCurrent=document.getElementById('current'), elFeedback=document.getElementById('feedback');
  const elSpoken=document.getElementById('spoken').querySelector('b');
  const elFill=document.getElementById('fill'), elProgressText=document.getElementById('progressText');
  const btnMic=document.getElementById('btnMic'), btnStop=document.getElementById('btnStop'), btnNext=document.getElementById('btnNext'), btnRepeat=document.getElementById('btnRepeat'), btnReset=document.getElementById('btnReset');
  const dot=document.getElementById('dot'), statusText=document.getElementById('statusText');
  const elScore=document.getElementById('score'), elCombo=document.getElementById('combo'), elBestCombo=document.getElementById('bestCombo');
  const timerFill=document.getElementById('timerFill');

  let seq=[],idx=0,recog=null,listening=false;
  let score=0, combo=0, bestCombo=0;
  let timerId=null, timeStart=0, timeLimit=5*1000;

  // ====== 유틸 ======
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function now(){ return performance.now(); }

  function buildSeq(){
    // 버벅 수정: 상태 완전 초기화, 타이머 정지, 표시 즉시 갱신
    clearTimer();
    const s=Math.min(+elStart.value||50, +elEnd.value||100);
    const e=Math.max(+elStart.value||50, +elEnd.value||100);
    const mode=elMode.value;

    const base=[]; for(let i=s;i<=e;i++) base.push(i);
    if(mode==='asc') seq = base;
    else if(mode==='desc') seq = base.slice().reverse();   // 100→50
    else seq = shuffle(base.slice());                      // 랜덤

    idx=0; elSpoken.textContent='-'; updateUI(true); // speak 생략(즉시 적용)
  }

  function updateUI(skipBar){
    const total=seq.length;
    const cur=seq[idx] ?? seq[total-1] ?? 0;
    elCurrent.textContent=cur;
    elProgressText.textContent=`${Math.min(idx,total)} / ${total}`;
    if(!skipBar) elFill.style.width=`${total?(idx/total)*100:0}%`;
    elFeedback.innerHTML="&nbsp;";
    updateScoreBoard();
    resetTimerBar();
  }

  function updateScoreBoard(){
    elScore.textContent = score;
    elCombo.textContent = combo;
    elBestCombo.textContent = bestCombo;
  }

  function resetAll(){
    score=0; combo=0; bestCombo=0;
    updateScoreBoard();
    buildSeq();
  }

  // ====== 타이머 ======
  function startTimer(){
    clearTimer();
    timeLimit = Math.max(2, Math.min(20, +elLimit.value||5)) * 1000;
    timeStart = now();
    tickTimer(); // 즉시 한 번 갱신
  }
  function tickTimer(){
    const elapsed = now() - timeStart;
    const left = Math.max(0, timeLimit - elapsed);
    const ratio = left / timeLimit;
    timerFill.style.width = `${ratio*100}%`;
    if(left<=0){
      // 시간 초과 → 오답 처리
      timerFill.style.width='0%';
      handleWrong('시간 초과!');
      return;
    }
    timerId = requestAnimationFrame(tickTimer);
  }
  function clearTimer(){ if(timerId){ cancelAnimationFrame(timerId); timerId=null; } }
  function resetTimerBar(){ timerFill.style.width='100%'; }

  // ====== 판정/점수 ======
  function onCorrect(){
    // 점수: 기본 10점 + 콤보 보너스(콤보-1)*2
    combo += 1;
    bestCombo = Math.max(bestCombo, combo);
    const add = 10 + Math.max(0, combo-1)*2;
    score += add;
    elFeedback.innerHTML=`<span class="ok">정답! +${add}점 <span class="combo">(${combo}콤보)</span> 👏</span>`;
    playDingDong();
    // 콤보가 높을수록 컨페티 살짝 더 많이
    startConfetti(900, Math.min(0.7 + combo*0.05, 1.2));
    next(true);
  }
  function handleWrong(msg){
    combo = 0; // 콤보 끊김
    elFeedback.innerHTML = `<span class="bad">${msg}</span>`;
    playBuzz();
    // 넘어가진 않음(스페이스/다시 말하기로 재도전). 랜덤 모드라면 오답 후 자동 다음을 원하면 아래 줄 주석 해제:
    // next(false);
  }

  function next(autoSpeak){
    clearTimer();
    idx++;
    const total = seq.length;
    if(idx>=total){
      finish();
      return;
    }
    elSpoken.textContent='-';
    elFill.style.width = `${(idx/total)*100}%`;
    elCurrent.textContent = seq[idx];
    resetTimerBar();
    if(autoSpeak) speak(seq[idx]);
    startTimer();
  }

  function finish(){
    clearTimer();
    elCurrent.textContent="🎉 끝!";
    elFeedback.innerHTML=`<span class="ok">완주! 총점 <b>${score}</b>점 · 최대 <b>${bestCombo}</b>콤보 🎊</span>`;
    startConfetti(1400, 1.0);
    stopListen();
  }

  // ====== 음성인식 ======
  const mapOnes={'영':0,'공':0,'일':1,'하나':1,'둘':2,'이':2,'셋':3,'삼':3,'넷':4,'사':4,'다섯':5,'오':5,'여섯':6,'육':6,'칠':7,'일곱':7,'팔':8,'여덟':8,'구':9,'아홉':9};
  const mapTens={'오십':50,'육십':60,'칠십':70,'팔십':80,'구십':90,'백':100};
  function parseKoreanNumber(s){
    if(!s) return NaN;
    s=s.replace(/\s+/g,'').replace(/[^\u3131-\u318F\uAC00-\uD7A30-9]/g,'');
    if(/^\d+$/.test(s)) return +s;
    if(s==='백') return 100;
    for(const t in mapTens){
      if(s.startsWith(t)){
        const base=mapTens[t], rest=s.slice(t.length);
        if(!rest) return base;
        if(mapOnes[rest]!=null) return base+mapOnes[rest];
      }
    }
    if(mapOnes[s]!=null) return mapOnes[s];
    return NaN;
  }

  function speak(n){
    try{ const u=new SpeechSynthesisUtterance(String(n)); u.lang='ko-KR'; u.rate=1.0; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
  }

  function handleSpoken(text){
    elSpoken.textContent=text;
    const want=seq[idx];
    const heard=parseKoreanNumber(text);
    const numIn=Number(text.replace(/[^0-9]/g,''));
    const val=!isNaN(heard)?heard:(!isNaN(numIn)?numIn:NaN);

    if(val===want) onCorrect();
    else handleWrong(isNaN(val)?'다시 또박또박 말해볼까요?':`들린 값 ${val} (정답 ${want})`);
  }

  function initRecog(){
    const SRc = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SRc){ alert('이 브라우저는 음성 인식을 지원하지 않아요. (Chrome/Edge 권장)'); return null; }
    const r=new SRc();
    r.lang='ko-KR'; r.continuous=true; r.interimResults=true; r.maxAlternatives=3;
    r.onstart=()=>{ setLive(true,'듣는 중… 숫자를 말해보세요'); btnMic.disabled=true; btnStop.disabled=false; startTimer(); };
    r.onend  =()=>{ setLive(false,'대기 중'); btnMic.disabled=false; btnStop.disabled=true; clearTimer(); if(listening){ try{r.start();}catch(e){} } };
    r.onresult=(e)=>{
      let txt='', final=false;
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i]; txt = res[0].transcript.trim(); if(res.isFinal) final=true;
      }
      if(txt){
        if(final) handleSpoken(txt);
        else elSpoken.textContent='…'+txt;
      }
    };
    r.onerror=(e)=>{ setLive(false,'인식 오류'); console.warn(e); };
    return r;
  }

  function setLive(live,msg){ dot.classList.toggle('live',live); statusText.textContent=msg||''; }

  async function startListen(){
    if(listening) return;
    try{
      getAudioCtx().resume();
      await navigator.mediaDevices.getUserMedia({audio:true});
      if(!recog) recog=initRecog();
      listening=true; recog && recog.start();
    }catch(e){ alert('마이크 권한이 필요합니다. 주소창 🔒 → 허용 후 새로고침'); }
  }
  function stopListen(){ listening=false; if(recog){ try{recog.stop();}catch(e){} } setLive(false,'대기 중'); btnMic.disabled=false; btnStop.disabled=true; clearTimer(); }

  // ====== 이벤트 ======
  btnMic.onclick=startListen;
  btnStop.onclick=stopListen;
  btnNext.onclick=()=>{ playTone(660,0.08,'sine',0.25); onCorrect(); }; // 수동 진행은 정답 처리와 동일
  btnRepeat.onclick=()=>{ const n=seq[idx]; if(n!=null) speak(n); };
  btnReset.onclick=resetAll;
  elApply.onclick=()=>{ buildSeq(); /* 즉시 현재 숫자 읽기(버벅 개선 위해 지연 0) */ const n=seq[0]; if(n!=null) setTimeout(()=>speak(n), 0); };
  elMode.onchange=buildSeq;
  elLimit.onchange=()=>{ /* 다음 문제부터 반영 */ };
  window.addEventListener('keydown',(e)=>{ if(e.code==='Space'){ e.preventDefault(); btnNext.click(); } });

  // ====== 초기화 ======
  buildSeq(); // 초기 상태(오름차순 50~100)
  document.getElementById('statusText').textContent='대기 중 (🎙️ 시작을 누르세요)';
})();
</script>
</body>
</html>
