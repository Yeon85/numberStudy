<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>초1용 50~100 숫자 말하기 연습</title>
<style>
  :root{--bg:#0f1115;--card:#161a22;--line:#232a37;--ink:#e9ecf1;--muted:#9aa4b2;--accent:#6ea8fe;--ok:#32d96b;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  header h1{font-size:18px;margin:0;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:14px}
  .big{font-size:96px;line-height:1;font-weight:800;text-align:center;margin:16px 0 4px}
  .sub{font-size:16px;text-align:center;color:var(--muted);min-height:22px}
  .center{display:flex;justify-content:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
  button{border:1px solid var(--line);background:#1b2130;color:#dfe6ef;border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .primary{background:#21406a;border-color:#2d4670}
  .ghost{background:transparent}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  .status{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:#666}.dot.live{background:#2ecc71;box-shadow:0 0 0 6px #2ecc7140}
  .bar{height:10px;background:#0e1320;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#6ea8fe,#32d96b)}
  .range{display:flex;gap:8px;align-items:center}
  input[type=number]{width:88px;background:#101522;color:#dfe6ef;border:1px solid var(--line);border-radius:10px;padding:8px}
  .spoken{margin-top:10px;font-size:15px;color:#a5b3cc;text-align:center;min-height:28px}
  .spoken b{color:#fff}
  .confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
  .piece{position:absolute;top:-10px;width:10px;height:14px;opacity:.9;animation:fall 1500ms linear forwards}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎤 50~100 숫자 말하기 연습</h1>
    <div class="row"><span class="chip">내가 말한 말도 아래에 보여요 🎧</span></div>
  </header>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:end">
      <div class="range">
        <label>시작</label><input id="start" type="number" value="50" />
        <label>끝</label><input id="end" type="number" value="100" />
        <button id="apply" class="ghost">범위 적용</button>
      </div>
      <div class="range"><label class="chip">진행: <span id="progressText">0 / 51</span></label></div>
    </div>

    <div class="bar" style="margin:12px 0 8px"><div id="fill" class="fill"></div></div>

    <div id="current" class="big" aria-live="polite">50</div>
    <div id="feedback" class="sub">&nbsp;</div>

    <div id="spoken" class="spoken">💬 내가 말한 말: <b>-</b></div>

    <div class="center">
      <button id="btnMic" class="primary">🎙️ 시작(마이크)</button>
      <button id="btnStop" class="ghost" disabled>⏹ 멈추기</button>
      <button id="btnNext" class="ghost">➡️ 다음</button>
      <button id="btnRepeat" class="ghost">🔁 다시 말하기(TTS)</button>
    </div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">대기 중</span>
    </div>
  </div>
</div>
<div id="fx" class="confetti"></div>

<script>
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const elStart=document.getElementById('start'), elEnd=document.getElementById('end'), elApply=document.getElementById('apply');
  const elCurrent=document.getElementById('current'), elFeedback=document.getElementById('feedback');
  const elSpoken=document.getElementById('spoken').querySelector('b');
  const elFill=document.getElementById('fill'), elProgressText=document.getElementById('progressText');
  const btnMic=document.getElementById('btnMic'), btnStop=document.getElementById('btnStop'), btnNext=document.getElementById('btnNext'), btnRepeat=document.getElementById('btnRepeat');
  const dot=document.getElementById('dot'), statusText=document.getElementById('statusText');
  const fx=document.getElementById('fx');
  let seq=[],idx=0,recog=null,listening=false;

  function buildSeq(){
    const s=Math.min(+elStart.value, +elEnd.value);
    const e=Math.max(+elStart.value, +elEnd.value);
    seq=[]; for(let i=s;i<=e;i++) seq.push(i);
    idx=0; updateUI();
  }
  function updateUI(){
    const total=seq.length;
    const cur=seq[idx]??seq[total-1];
    elCurrent.textContent=cur;
    elProgressText.textContent=`${Math.min(idx,total)} / ${total}`;
    elFill.style.width=`${total?(idx/total)*100:0}%`;
    elFeedback.innerHTML="&nbsp;";
  }

  const mapOnes={'영':0,'공':0,'일':1,'하나':1,'둘':2,'이':2,'셋':3,'삼':3,'넷':4,'사':4,'다섯':5,'오':5,'여섯':6,'육':6,'칠':7,'일곱':7,'팔':8,'여덟':8,'구':9,'아홉':9};
  const mapTens={'오십':50,'육십':60,'칠십':70,'팔십':80,'구십':90,'백':100};
  function parseKoreanNumber(s){
    s=s.replace(/\s+/g,'').replace(/[^\u3131-\u318F\uAC00-\uD7A30-9]/g,'');
    if(/^\d+$/.test(s)) return +s;
    if(s==='백') return 100;
    for(const t in mapTens){
      if(s.startsWith(t)){
        const base=mapTens[t], rest=s.slice(t.length);
        if(!rest) return base;
        if(mapOnes[rest]!=null) return base+mapOnes[rest];
      }
    }
    if(mapOnes[s]!=null) return mapOnes[s];
    return NaN;
  }

  function speak(n){
    const u=new SpeechSynthesisUtterance(String(n));
    u.lang='ko-KR'; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }

  function next(){
    idx++;
    if(idx>=seq.length){ finish(); return; }
    elFeedback.innerHTML="&nbsp;"; elSpoken.textContent='-';
    updateUI(); speak(seq[idx]);
  }

  function finish(){
    elCurrent.textContent="🎉 끝!";
    elFeedback.innerHTML=`<span class="ok">아주 잘했어요! 👏</span>`;
    burstConfetti(); stopListen();
  }

  function burstConfetti(n=60){
    const colors=['#6ea8fe','#32d96b','#ffd166','#ff6b6b','#a78bfa'];
    for(let i=0;i<n;i++){
      const d=document.createElement('div');
      d.className='piece';
      d.style.left=(Math.random()*100)+'%';
      d.style.background=colors[i%colors.length];
      d.style.animationDuration=(1000+Math.random()*1000)+'ms';
      fx.appendChild(d); setTimeout(()=>d.remove(),1800);
    }
  }

  function handleSpoken(text){
    elSpoken.textContent=text;
    const want=seq[idx];
    const heard=parseKoreanNumber(text);
    const numIn=Number(text.replace(/[^0-9]/g,''));
    const val=!isNaN(heard)?heard:(!isNaN(numIn)?numIn:NaN);
    if(val===want){
      elFeedback.innerHTML=`<span class="ok">정답! ${want} 👏</span>`;
      next();
    }else{
      elFeedback.innerHTML=`<span class="bad">${isNaN(val)?'다시 말해볼까요?':`들린 값 ${val} (정답 ${want})`}</span>`;
    }
  }

  function initRecog(){
    if(!SR){ alert('이 브라우저는 음성 인식을 지원하지 않아요. (Chrome/Edge 사용)'); return null; }
    const r=new SR();
    r.lang='ko-KR'; r.continuous=true; r.interimResults=true;
    r.onstart=()=>{ setLive(true,'듣는 중...'); };
    r.onend=()=>{ setLive(false,'대기 중'); if(listening){ try{r.start();}catch(e){} } };
    r.onresult=(e)=>{
      let txt='',final=false;
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        txt=res[0].transcript.trim();
        if(res.isFinal) final=true;
      }
      if(txt){
        if(final) handleSpoken(txt);
        else elSpoken.textContent=''+txt;
      }
    };
    return r;
  }

  function setLive(live,msg){ dot.classList.toggle('live',live); statusText.textContent=msg; }
  async function startListen(){
    if(listening) return;
    try{
      await navigator.mediaDevices.getUserMedia({audio:true});
      if(!recog) recog=initRecog();
      listening=true; recog.start(); btnMic.disabled=true; btnStop.disabled=false;
    }catch(e){ alert('마이크 권한이 필요합니다. 주소창 🔒 클릭 → 허용 후 새로고침'); }
  }
  function stopListen(){ listening=false; if(recog){ try{recog.stop();}catch(e){} } btnMic.disabled=false; btnStop.disabled=true; setLive(false,'대기 중'); }

  btnMic.onclick=startListen;
  btnStop.onclick=stopListen;
  btnNext.onclick=next;
  btnRepeat.onclick=()=>speak(seq[idx]);
  elApply.onclick=()=>buildSeq();
  window.onkeydown=(e)=>{ if(e.code==='Space'){ e.preventDefault(); next(); } };

  buildSeq();
})();
</script>
</body>
</html>
